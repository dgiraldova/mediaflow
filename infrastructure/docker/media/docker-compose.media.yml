# Local media-pipeline infrastructure (spec MVP1-003, owner: Member C).
#
# Brings up everything the worker needs to run end-to-end locally:
#   - Temporal dev server (+ Web UI) for workflow orchestration
#   - MinIO as an S3-compatible stand-in for Cloudflare R2
#   - The media worker itself, with FFmpeg baked into its image
#
# Included from the repository-root docker-compose.yml so `make dev` starts
# these alongside the web and API apps.

name: mediaflow-media

services:
  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "7233:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_healthy

  # Local stand-in for Cloudflare R2. Same S3 API, so the worker's R2Client
  # runs unchanged against it — only R2_ENDPOINT_URL differs from production.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=mediaflow
      - MINIO_ROOT_PASSWORD=mediaflow-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the media bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mediaflow mediaflow-dev-secret &&
      mc mb --ignore-existing local/mediaflow-media &&
      mc anonymous set none local/mediaflow-media
      "

  worker:
    build:
      context: ../../../apps/worker
      dockerfile: Dockerfile
    environment:
      - WORKER_ENVIRONMENT=development
      - WORKER_LOG_LEVEL=INFO
      - WORKER_TEMP_DIR=/var/tmp/mediaflow-worker
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=media-ingestion
      - R2_ENDPOINT_URL=http://minio:9000
      - R2_ACCESS_KEY_ID=mediaflow
      - R2_SECRET_ACCESS_KEY=mediaflow-dev-secret
      - R2_BUCKET=mediaflow-media
      # AI provider keys are intentionally absent by default: the worker
      # falls back to Null adapters so the pipeline runs offline without
      # spending API credits. Set them in .env to exercise real providers.
      - TRANSCRIPTION_API_KEY=${TRANSCRIPTION_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TWELVE_LABS_API_KEY=${TWELVE_LABS_API_KEY:-}
      - TWELVE_LABS_INDEX_ID=${TWELVE_LABS_INDEX_ID:-}
    volumes:
      - worker-temp:/var/tmp/mediaflow-worker
    depends_on:
      temporal:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  temporal-postgres-data:
  minio-data:
  worker-temp:
